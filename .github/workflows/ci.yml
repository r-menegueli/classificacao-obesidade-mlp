name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Executar análise
        run: python analise_obesidade.py

      - name: Verificar métricas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metricas = json.loads(Path("resultados/metricas.json").read_text(encoding="utf-8"))
          assert metricas["amostras"] == 108
          assert metricas["validacao_cruzada"]["acuracia_balanceada"]["media"] > 0.75
          assert len(metricas["classes"]) == 4
          print("Métricas verificadas.")
          PY
